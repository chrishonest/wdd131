<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Submit a product review and rate your experience with our available products.">
    <meta name="author" content="Honest Christopher">

    <title>Product Review | Honest Christopher</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">
                Product Name <span aria-hidden="true">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>
                    Overall Rating <span aria-hidden="true">*</span>
                </legend>

                <div class="rating">
                    <label for="rating1">1 ☆</label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">2 ☆</label>
                    <input type="radio" id="rating2" name="rating" value="2">

                    <label for="rating3">3 ☆</label>
                    <input type="radio" id="rating3" name="rating" value="3">

                    <label for="rating4">4 ☆</label>
                    <input type="radio" id="rating4" name="rating" value="4">

                    <label for="rating5">5 ☆</label>
                    <input type="radio" id="rating5" name="rating" value="5">
                </div>
            </fieldset>

            <label for="installation-date">
                Date of Installation <span aria-hidden="true">*</span>
            </label>

            <input type="date" id="installation-date" name="installation-date" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    Durability
                </label>

                <label for="ease-of-use">
                    <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <label for="review">
                Written Review <span>(Optional)</span>
            </label>

            <textarea id="review" name="review" rows="6"></textarea>

            <label for="username">
                Your Name <span>(Optional)</span>
            </label>

            <input type="text" id="username" name="username">

            <input type="submit" value="Post Your Review">
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Honest Christopher | Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
